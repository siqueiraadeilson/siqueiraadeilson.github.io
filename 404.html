<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Adeilson Siqueira</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#111313">
  <link rel="canonical" href="https://siqueiraadeilson.github.io/">
  <link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/101469157?s=64&v=4">
  <style>
    :root{--bg:#111313;--text:#f0f0e9;--muted:#9ba09a;--line:#343938;--lime:#d7ff48;--mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--display:'Syne',sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--display);padding:32px;text-align:center}
    .code{font:500 13px var(--mono);letter-spacing:.14em;color:var(--lime);text-transform:uppercase}
    h1{font-size:clamp(2.4rem,7vw,4.4rem);line-height:.98;letter-spacing:-.05em;margin:22px 0 14px}
    em{font-style:normal;color:var(--lime)}
    p{max-width:420px;margin:0 auto 34px;color:var(--muted);font-family:var(--mono);font-size:13px;line-height:1.7}
    a{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border:1px solid var(--line);border-radius:999px;color:var(--text);font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:border-color .2s,color .2s}
    a:hover,a:focus-visible{border-color:var(--lime);color:var(--lime)}
  </style>
</head>
<body>
  <main>
    <span class="code">Erro 404 / rota inexistente</span>
    <h1>Esta página<br><em>não existe.</em></h1>
    <p>O endereço pode ter mudado ou nunca ter existido. O portfólio continua no lugar certo.</p>
    <a href="/">Voltar ao portfólio</a>
  </main>
</body>
</html>
